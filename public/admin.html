<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Intelligence | NxtWave</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #0b1020; color: #fff; line-height: 1.6; }
    .container { width: 90%; max-width: 1100px; margin: auto; }
    nav { padding: 18px 0; border-bottom: 1px solid #252b40; }
    nav .container { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 20px; font-weight: bold; }
    .logo span { color: #7c5cff; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 30px 0 20px; }
    .stat { background: #12182b; border: 1px solid #252b40; border-radius: 12px; padding: 20px; text-align: center; }
    .stat h3 { font-size: 30px; margin-bottom: 5px; }
    .stat p { color: #aeb8d0; font-size: 13px; }
    .analytics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    .card { background: #12182b; border: 1px solid #252b40; border-radius: 14px; padding: 22px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #252b40; }
    th { color: #9f8cff; }
    button { padding: 10px 18px; border-radius: 8px; border: none; background: #7c5cff; color: #fff; cursor: pointer; font-weight: bold; }
    .secondary { background: #202842; }
    .insight-box { background: #0c1222; border-left: 4px solid #7c5cff; padding: 15px; border-radius: 8px; margin-top: 15px; font-size: 14px; white-space: pre-line; }
    @media(max-width: 800px) { .stats, .analytics-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <nav>
    <div class="container">
      <div class="logo">NxtWave <span>Admin Intelligence</span></div>
      <div>
        <span id="adminWelcome" style="margin-right: 15px; font-size: 14px;"></span>
        <button class="secondary" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="stats">
      <div class="stat"><h3 id="admTotal">0</h3><p>Total Registrations</p></div>
      <div class="stat"><h3 id="admReferral">0</h3><p>Referral Signups</p></div>
      <div class="stat"><h3 id="admDirect">0</h3><p>Direct Registrations</p></div>
      <div class="stat"><h3>500</h3><p>Target Milestone</p></div>
    </div>

    <div class="analytics-grid">
      <div class="card">
        <h3>Top Colleges</h3>
        <table>
          <thead><tr><th>College</th><th>Registrations</th></tr></thead>
          <tbody id="collegeTable"></tbody>
        </table>
      </div>

      <div class="card">
        <h3>🏆 Campus Referral Leaderboard</h3>
        <table>
          <thead><tr><th>Student</th><th>College</th><th>Referrals</th></tr></thead>
          <tbody id="leaderboardTable"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>🧠 AI Campaign Analyst</h3>
        <button onclick="runAdminAIAnalysis()">Analyze Campaign Growth</button>
      </div>
      <div id="aiInsightBox" class="insight-box">Click "Analyze Campaign Growth" to run optimization analysis.</div>
    </div>
  </main>

  <script src="/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      enforceRole("admin");
      const user = getCurrentUser();
      if (user) {
        document.getElementById("adminWelcome").innerText = `Admin: ${user.name}`;
      }
      loadAdminMetrics();
    });
  </script>
</body>
</html>
